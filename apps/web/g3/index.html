<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noita Together statistics</title><link rel="stylesheet" href="/style.css"></head>
<body><main><h1>Run statistics</h1><p>Local test accounts. Gameplay reports are labelled by their source. Statistics expire after 30 days.</p>
<button id="login">Sign in with local website account</button><button id="logout" disabled>Sign out</button>
<p id="status" role="status">Sign in to view your recorded runs.</p>
<label>Recorded run <select id="rooms" disabled><option value="">Choose a recorded run</option></select></label>
<button id="history-first" disabled>Refresh run list</button><button id="history-next" disabled>Next runs</button>
<p id="run"></p><button id="reload" disabled>First page</button><button id="next" disabled>Next page</button><button id="delete" disabled>Delete this run’s statistics</button>
<h2>Totals</h2><ul id="totals"></ul><h2>Recorded events</h2><ol id="records"></ol><a href="/">Room controls</a>
</main><script type="module" src="/g3/page.js"></script></body></html>
