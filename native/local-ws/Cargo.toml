[package]
name = "nt2-local-ws"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.32", features = ["sink"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
hmac = "=0.12.1"
getrandom = "=0.3.4"
zeroize = "=1.9.0"
